name: CI/CD - Onda Sonora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Validar projeto
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do projeto
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verificar arquivos essenciais
        run: |
          test -s index.html
          test -s assets/css/style.css
          test -s js/main.js
          test -s js/audio.js
          test -s js/notes.js

      - name: Validar sintaxe JavaScript
        run: |
          for arquivo in js/*.js; do
            echo "Validando: $arquivo"
            node --check --input-type=module < "$arquivo"
          done

  deploy:
    name: Publicar no Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar deploy do commit validado
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK}&ref=${COMMIT_SHA}" --output /dev/null
